<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ea580c'/%3E%3Ctext x='50' y='68' font-size='60' font-weight='bold' text-anchor='middle' fill='white'%3E공%3C/text%3E%3C/svg%3E">
<title>이진주방산업</title>
<style id="tailwind-offline">
*,:after,:before{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgba(59,130,246,.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-shadow-colored:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-drop-shadow: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-drop-shadow) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia);--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia)}*,::before,::after{border-color:var(--tw-border-color,#e5e7eb)}html{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal}body{margin:0;line-height:inherit}
</style>
<style>
  :root{
    --user-bg:#EEF2F1;--user-card-bg:#ffffff;--user-accent:#146C8E;
    --user-accent-dark:#0F3A4D;--user-accent-tint:#EAF4F6;--user-accent-border:#BFDDE6;
    --ink-900:#1B2A31;--ink-700:#475569;--ink-500:#64748b;
    --line:#E3E9E8;--radius-card:12px;--radius-sm:6px;
    --shadow-card:0 1px 2px rgba(15,40,50,.04), 0 8px 20px -12px rgba(15,40,50,.12);
    --shadow-pop:0 12px 28px rgba(15,40,50,.16);
  }
  *{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{background:var(--user-bg);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink-900);letter-spacing:-.1px}
  
  /* 환영 모달 스타일 */
  .welcome-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.7);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  
  .welcome-modal.show {
    display: flex;
    animation: fadeIn 0.3s ease-out;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .welcome-modal-content {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    text-align: center;
    animation: slideUp 0.4s ease-out;
  }
  
  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .welcome-icon {
    font-size: 56px;
    margin-bottom: 20px;
  }
  
  .welcome-title {
    font-size: 24px;
    font-weight: 700;
    color: #1B2A31;
    margin-bottom: 15px;
  }
  
  .welcome-quote {
    font-size: 14px;
    color: #475569;
    line-height: 1.8;
    margin-bottom: 30px;
    font-style: italic;
    padding: 20px;
    background: #f8fafc;
    border-left: 4px solid #146C8E;
    border-radius: 6px;
  }
  
  .welcome-quote-author {
    font-size: 12px;
    color: #64748b;
    margin-top: 8px;
  }
  
  .welcome-buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
  }
  
  .welcome-btn {
    flex: 1;
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .welcome-btn-primary {
    background: linear-gradient(135deg, #0F3A4D 0%, #146C8E 100%);
    color: #fff;
  }
  
  .welcome-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(20,108,142,.4);
  }
  
  .welcome-btn-secondary {
    background: #e2e8f0;
    color: #2d3748;
  }
  
  .welcome-btn-secondary:hover {
    background: #cbd5e0;
  }
</style>

<!-- 기존 스타일 (원본 파일에서 계속...) -->
<style>
   input[type=number]::-webkit-inner-spin-button{opacity:.5}
   .sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--user-accent);background:var(--user-accent-tint);border-left:4px solid var(--user-accent);padding:9px 14px;border-radius:6px}
   .pcard{background:var(--user-card-bg);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card);transition:box-shadow .15s ease}
</style>
</head>
<body class="p-3 md:p-5">

<!-- 환영 모달 -->
<div id="welcomeModal" class="welcome-modal">
  <div class="welcome-modal-content">
    <div class="welcome-icon">🏭</div>
    <div class="welcome-title">환영합니다!</div>
    <div class="welcome-quote" id="welcomeQuote">
      좋은 준비는 성공의 절반입니다.
      <div class="welcome-quote-author">— 벤저민 프랭클린</div>
    </div>
    <div class="welcome-buttons">
      <button class="welcome-btn welcome-btn-primary" onclick="closeWelcomeModal()">시작하기</button>
      <button class="welcome-btn welcome-btn-secondary" onclick="openInfoPage()">정보 보기</button>
    </div>
  </div>
</div>

<!-- 상단 헤더 바 (기존 구조 유지) -->
<div class="max-w-5xl mx-auto bg-white rounded-lg shadow-md mb-4 p-4 no-print" style="position:sticky;top:0;z-index:200">
  <div class="mb-3">
    <div style="height:31px;display:flex;align-items:center;justify-content:space-between;">
      <h1 class="text-lg font-bold text-gray-800" style="margin:0;flex:none;">📄 이진주방산업</h1>
      <!-- 정보 버튼 추가 -->
      <button onclick="openInfoPage()" title="프로그램 정보 및 사용법 가이드" style="padding:0 13px;height:31px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1;border:1px solid #d1d5db;background:#f3f4f6;color:#374151;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:all .2s;margin-left:auto;margin-right:8px;">
        ℹ️ 정보
      </button>
    </div>
  </div>
  
  <!-- 기존 헤더 내용 계속... -->
  <div class="flex gap-1 flex-wrap justify-end">
    <!-- 기존 버튼들이 여기에 들어옴 -->
  </div>
</div>

<!-- 기존 콘텐츠 -->
<div style="max-width:5xl; margin:auto; padding:20px;">
  <div style="background:white;border-radius:12px;padding:30px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.1)">
    <h2 style="color:#1B2A31;font-size:24px;margin-bottom:15px;">이진주방산업</h2>
    <p style="color:#475569;font-size:14px;line-height:1.8;margin-bottom:20px;">
      견적서, 발주서, 거래명세표 등 업무 서류를 한 곳에서 관리하는 <strong>통합 관리 시스템</strong>입니다.<br>
      데이터는 이 컴퓨터의 이 브라우저 안에 자동으로 저장되므로, 인터넷 연결 없이도 안심하고 사용할 수 있습니다.
    </p>
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:20px;margin:20px 0;">
      <h3 style="color:#2d3748;font-size:14px;margin-bottom:12px;">📋 주요 기능</h3>
      <ul style="text-align:left;color:#475569;font-size:12px;line-height:2;">
        <li>✓ 견적서·발주서·거래명세표 작성</li>
        <li>✓ 품목 단가표 관리</li>
        <li>✓ 거래처·담당자 연락처 관리</li>
        <li>✓ 재고 관리</li>
        <li>✓ 가계부(수입/지출) 기록</li>
        <li>✓ 자동 저장·백업 기능</li>
      </ul>
    </div>
    <button onclick="openMainApp()" style="background:linear-gradient(135deg,#0F3A4D 0%,#146C8E 100%);color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:20px;">
      📊 프로그램 시작
    </button>
  </div>
</div>

<script>
// 환영 모달 제어
function showWelcomeModal() {
  const modal = document.getElementById('welcomeModal');
  modal.classList.add('show');
  localStorage.setItem('welcomeModalShown', 'true');
}

function closeWelcomeModal() {
  const modal = document.getElementById('welcomeModal');
  modal.classList.remove('show');
}

function openInfoPage() {
  closeWelcomeModal();
  window.location.href = 'chat.html';
}

function openMainApp() {
  closeWelcomeModal();
  // 실제 앱이 로드되면 이 페이지는 replace됨
  window.location.href = 'index.html';
}

// 처음 방문 시에만 환영 모달 표시
document.addEventListener('DOMContentLoaded', function() {
  if (!localStorage.getItem('welcomeModalShown')) {
    showWelcomeModal();
  }
});

// 명언 배열
const quotes = [
  { text: "좋은 준비는 성공의 절반입니다.", author: "벤저민 프랭클린" },
  { text: "성공은 준비와 기회의 만남입니다.", author: "로버트 키요사키" },
  { text: "성공하는 사람들은 매일 계획을 세웁니다.", author: "짐 론" },
  { text: "작은 성공이 모여 큰 성공을 만듭니다.", author: "공자" },
  { text: "체계적인 일처리가 신뢰를 만듭니다.", author: "피터 드러커" },
  { text: "기록이 남으면 일은 명확해집니다.", author: "도요타 생산방식" },
  { text: "효율성은 계획에서 시작됩니다.", author: "벤저민 프랭클린" },
  { text: "정보 관리가 경쟁력입니다.", author: "톰 피터스" }
];

// 페이지 로드 시 랜덤 명언 표시
function displayRandomQuote() {
  const quote = quotes[Math.floor(Math.random() * quotes.length)];
  const quoteEl = document.getElementById('welcomeQuote');
  if (quoteEl) {
    quoteEl.innerHTML = `
      ${quote.text}
      <div class="welcome-quote-author">— ${quote.author}</div>
    `;
  }
}

window.addEventListener('load', displayRandomQuote);
</script>

</body>
</html>
