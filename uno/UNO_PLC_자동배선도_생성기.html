<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO PLC 자동 배선도 생성기</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",Arial,sans-serif;background:#eef1f5;color:#18202a}
header{background:#17212b;color:#fff;padding:14px 20px;font-size:20px;font-weight:700}
header span{display:block;font-size:12px;font-weight:400;color:#cbd5e1;margin-top:4px}
main{max-width:1400px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d7dde5;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:9px 13px;background:#2563eb;color:#fff;cursor:pointer;font-weight:700}.btn.gray{background:#64748b}
input[type=file]{max-width:360px}.small{font-size:12px;color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #d9dee7;padding:7px;text-align:left}th{background:#f1f5f9}.used{background:#eff6ff}
.diagram{overflow:auto;background:#fafafa;border:1px solid #d5dbe3;border-radius:8px;padding:8px}
svg{min-width:1050px;width:100%;height:auto;background:white}
.seq{padding:8px 10px;border:1px solid #dbe1e8;border-radius:7px;margin:6px 0;background:#fbfcfe}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
@media print{.noprint{display:none!important}body{background:white}.card{box-shadow:none}}
</style>
</head>
<body>
<header>🔌 UNO PLC 자동 배선도 생성기<span>JSON을 불러오면 실제 사용 CH/R과 시퀀스를 분석하여 배선도·I/O표·동작 흐름을 자동 생성합니다.</span></header>
<main>
<div class="card noprint">
 <div class="toolbar">
  <input id="file" type="file" accept=".json,application/json">
  <button class="btn" onclick="print()">🖨 배선도 인쇄 / PDF</button>
  <button class="btn gray" onclick="demo()">▶ 예제 불러오기</button>
  <span id="info" class="small">JSON 파일을 선택하세요.</span>
 </div>
</div>
<div id="app" style="display:none">
 <div class="card"><b id="title"></b><div class="small" id="summary" style="margin-top:5px"></div></div>
 <div class="card"><h3>① 자동 배선도</h3><div class="diagram"><svg id="svg" viewBox="0 0 1250 720"></svg></div></div>
 <div class="grid">
  <div class="card"><h3>② 입력 배선표</h3><table><thead><tr><th>CH</th><th>보드핀</th><th>장치명</th><th>사용</th></tr></thead><tbody id="inputs"></tbody></table></div>
  <div class="card"><h3>③ 출력 배선표</h3><table><thead><tr><th>R</th><th>보드핀</th><th>장치명</th><th>사용</th></tr></thead><tbody id="outputs"></tbody></table></div>
 </div>
 <div class="card"><h3>④ 자동 생성 시퀀스 / 배선 확인</h3><div id="seq"></div></div>
</div>
</main>
<script>
const INP=[7,8,9,10,11,12,2,13,14,15,16,17], OUTP=[3,4,5,6];
let obj=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function used(){
 let ins=new Set(), outs=new Set();
 (obj.seqs||[]).forEach(s=>{
  if(s.trigCh)ins.add(s.trigCh); (s.conds||[]).forEach(c=>ins.add(c.ch));
  (s.steps||[]).forEach(st=>{if(st.relay)outs.add(st.relay);if(st.wait)ins.add(st.wait.ch)});
 }); return {ins,outs};
}
function render(){
 const u=used(), name=obj.name||'제목 없음'; $('title').textContent='📄 '+name+' — 자동 배선도';
 $('summary').textContent=`입력 ${u.ins.size}개 / 출력 ${u.outs.size}개 / 시퀀스 ${(obj.seqs||[]).length}개 자동 분석`;
 $('inputs').innerHTML=INP.map((p,i)=>`<tr class="${u.ins.has(i+1)?'used':''}"><td>CH${i+1}</td><td>D${p}</td><td>${u.ins.has(i+1)?'사용 입력':'-'}</td><td>${u.ins.has(i+1)?'●':''}</td></tr>`).join('');
 $('outputs').innerHTML=OUTP.map((p,i)=>`<tr class="${u.outs.has(i+1)?'used':''}"><td>R${i+1}</td><td>D${p}</td><td>${u.outs.has(i+1)?'사용 출력':'-'}</td><td>${u.outs.has(i+1)?'●':''}</td></tr>`).join('');
 $('seq').innerHTML=(obj.seqs||[]).map((s,i)=>{
  const cond=(s.conds||[]).map(c=>`CH${c.ch}=${c.state}`).join(' + ')||'-';
  const steps=(s.steps||[]).map(x=>`R${x.relay} ${x.state}${x.wait?` → CH${x.wait.ch} ${x.wait.state} 대기`:''}`).join(' → ');
  return `<div class="seq"><b>${i+1}. ${esc(s.name)}</b><br>트리거: CH${s.trigCh} ${s.trigCond}　조건: ${cond}<br>동작: ${steps}</div>`;
 }).join('');
 draw(u); $('app').style.display='block';
}
function draw(u){
 const svg=$('svg'); let s=`<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#334155"/></marker></defs>`;
 s+=`<rect x="25" y="25" width="180" height="55" rx="7" fill="#e2e8f0" stroke="#64748b"/><text x="115" y="58" text-anchor="middle" font-size="18" font-weight="700">+24V / 0V 전원</text>`;
 s+=`<rect x="485" y="80" width="280" height="540" rx="12" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/><text x="625" y="112" text-anchor="middle" font-size="22" font-weight="700">UNO 제어보드</text>`;
 s+=`<text x="625" y="135" text-anchor="middle" font-size="12" fill="#64748b">입력 D7~D12 / 출력 D3~D6</text>`;
 const inYs=[170,220,270,320,370,420], outYs=[490,535,580,625];
 [...u.ins].sort((a,b)=>a-b).slice(0,6).forEach((ch,k)=>{
  let y=inYs[k], pin=INP[ch-1]; s+=`<rect x="505" y="${y-18}" width="90" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="550" y="${y+5}" text-anchor="middle" font-weight="700">CH${ch} / D${pin}</text>`;
  s+=`<line x1="505" y1="${y}" x2="285" y2="${y}" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/>`;
  s+=`<rect x="70" y="${y-22}" width="190" height="44" rx="6" fill="#fff" stroke="#64748b"/><text x="165" y="${y+5}" text-anchor="middle" font-size="14">센서 / 스위치 CH${ch}</text>`;
 });
 [...u.outs].sort((a,b)=>a-b).slice(0,4).forEach((r,k)=>{
  let y=outYs[k], pin=OUTP[r-1]; s+=`<rect x="505" y="${y-18}" width="90" height="36" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="550" y="${y+5}" text-anchor="middle" font-weight="700">R${r} / D${pin}</text>`;
  s+=`<line x1="595" y1="${y}" x2="845" y2="${y}" stroke="#16a34a" stroke-width="3" marker-end="url(#arr)"/>`;
  s+=`<rect x="870" y="${y-22}" width="250" height="44" rx="6" fill="#fff" stroke="#64748b"/><text x="995" y="${y+5}" text-anchor="middle" font-size="14">릴레이 R${r} → 부하/밸브</text>`;
 });
 s+=`<rect x="855" y="95" width="300" height="280" rx="8" fill="#fff" stroke="#94a3b8"/><text x="1005" y="120" text-anchor="middle" font-weight="700">자동 분석 결과</text>`;
 let yy=150; (obj.seqs||[]).forEach((q,i)=>{s+=`<text x="875" y="${yy}" font-size="12" font-weight="700">${i+1}. ${esc(q.name).slice(0,34)}</text>`;yy+=24;});
 s+=`<text x="35" y="690" font-size="12" fill="#64748b">※ 현재 JSON에서 확인 가능한 논리 연결을 자동 표시합니다. 실제 단자대·전원·릴레이 접점 번호는 장비 배선 규격 입력 후 확정해야 합니다.</text>`;
 svg.innerHTML=s;
}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{obj=JSON.parse(await f.text());if(!Array.isArray(obj.seqs))throw Error('seqs가 없습니다.');$('info').textContent='불러옴: '+f.name;render()}catch(x){alert(x.message)}};
function demo(){obj=DEMO;$('info').textContent='예제 캡핑기 JSON';render()}
const DEMO={"__type": "unoDocV1", "name": "캡핑기", "seqs": [{"name": "센서 신호를 받을때  1 타이머 작동", "trigCh": 1, "trigCond": "OFF", "condMode": "AND", "conds": [{"ch": 1, "state": "OFF"}, {"ch": 6, "state": "ON"}], "steps": [{"relay": 1, "state": "ON", "delay": 0, "wait": {"ch": 2, "state": "ON"}}, {"relay": 3, "state": "ON", "delay": 0, "wait": {"ch": 3, "state": "ON"}}, {"relay": 4, "state": "ON", "delay": 0, "wait": {"ch": 4, "state": "ON"}}, {"relay": 2, "state": "ON", "delay": 0, "wait": {"ch": 5, "state": "ON"}}, {"relay": 4, "state": "OFF", "delay": 0, "wait": null}], "orderExempt": false}, {"name": "올림 SET", "trigCh": 6, "trigCond": "BOTH", "condMode": "AND", "conds": [{"ch": 5, "state": "ON"}, {"ch": 6, "state": "ON"}], "steps": [{"relay": 1, "state": "OFF", "delay": 0}, {"relay": 3, "state": "OFF", "delay": 0}, {"relay": 4, "state": "OFF", "delay": 0}, {"relay": 2, "state": "OFF", "delay": 0}], "orderExempt": false}, {"name": "스위치 1", "trigCh": 2, "trigCond": "ON", "condMode": "AND", "conds": [{"ch": 2, "state": "ON"}, {"ch": 6, "state": "ON"}], "steps": [{"relay": 4, "state": "ON", "delay": 0, "wait": {"ch": 3, "state": "ON"}}, {"relay": 3, "state": "ON", "delay": 0, "wait": {"ch": 6, "state": "ON"}}, {"relay": 3, "state": "OFF", "delay": 0, "wait": null}, {"relay": 4, "state": "OFF", "delay": 0, "wait": null}], "orderExempt": false}]};
</script>
</body></html>
